<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMate - Profil Saya</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-header {
            text-align: center;
            padding: 30px 20px;
            background: var(--white);
            border-radius: 0 0 30px 30px;
            box-shadow: var(--shadow-soft);
        }

        .profile-img-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            border: 4px solid var(--white);
            box-shadow: 0 5px 15px rgba(108, 99, 255, 0.3);
        }

        .badge-premium {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--warning);
            color: white;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            border: 2px solid white;
        }

        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            box-shadow: var(--shadow-soft);
        }

        .stat-card h3 { color: var(--primary); margin-bottom: 5px; }
        .stat-card p { font-size: 11px; margin: 0; }

        .menu-list { padding: 0 20px; }
        
        .menu-item {
            background: white;
            padding: 15px 20px;
            border-radius: 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: var(--dark);
            transition: var(--transition);
        }

        .menu-item:active { transform: scale(0.98); background: #f0f0f0; }
        .menu-item i { width: 20px; text-align: center; }
        .menu-item span { flex: 1; font-size: 14px; font-weight: 500; }
        .menu-item .chevron { color: var(--light-gray); font-size: 12px; }

        .logout-btn {
            margin: 20px;
            padding: 15px;
            border-radius: 18px;
            background: rgba(255, 77, 77, 0.1);
            color: var(--danger);
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .logout-btn:hover { background: var(--danger); color: white; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="top-bar" style="background: var(--white);">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h5 style="margin: 0;">Profil Saya</h5>
            <a href="pengaturan.html" style="color: var(--dark);"><i class="fas fa-cog"></i></a>
        </div>

        <div class="content">
            <div class="profile-header">
                <div class="profile-img-container">
                    <div class="profile-img">
                        <i class="fas fa-user-astronaut"></i>
                    </div>
                    <div class="badge-premium">PREMIUM</div>
                </div>
                <h4 style="margin-bottom: 5px;">Maulana Rizky Ferdinand</h4>
                <p style="font-size: 12px;">"Sobat Tangguh MindMate"</p>
            </div>

            <div class="stats-container">
                <div class="stat-card">
                    <h3>12</h3>
                    <p>Hari Beruntun</p>
                </div>
                <div class="stat-card">
                    <h3>48</h3>
                    <p>Total Jurnal</p>
                </div>
            </div>

            <div class="menu-list">
                <a href="pengaturan.html" class="menu-item">
                    <i class="fas fa-user-edit" style="color: var(--primary);"></i>
                    <span>Edit Profil</span>
                    <i class="fas fa-chevron-right chevron"></i>
                </a>
                <a href="edukasi.html" class="menu-item">
                    <i class="fas fa-bookmark" style="color: var(--accent);"></i>
                    <span>Materi Disimpan</span>
                    <i class="fas fa-chevron-right chevron"></i>
                </a>
                <a href="#" class="menu-item">
                    <i class="fas fa-shield-alt" style="color: var(--success);"></i>
                    <span>Keamanan & Privasi</span>
                    <i class="fas fa-chevron-right chevron"></i>
                </a>
                <a href="#" class="menu-item">
                    <i class="fas fa-question-circle" style="color: var(--warning);"></i>
                    <span>Pusat Bantuan</span>
                    <i class="fas fa-chevron-right chevron"></i>
                </a>
            </div>

            <div class="logout-btn" onclick="confirmLogout()">
                <i class="fas fa-sign-out-alt"></i> Keluar Akun
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
            <a href="chat.html" class="nav-item"><i class="fas fa-comment-dots"></i><span>Chat</span></a>
            <a href="relax.html" class="nav-item"><i class="fas fa-spa"></i><span>Relax</span></a>
            <a href="komunitas.html" class="nav-item"><i class="fas fa-users"></i><span>Forum</span></a>
            <a href="profil.html" class="nav-item active"><i class="fas fa-user"></i><span>Profil</span></a>
        </nav>
    </div>

    <script>
        function confirmLogout() {
            if(confirm('Apakah kamu yakin ingin keluar?')) {
                alert('Berhasil keluar!');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>

</html>
